{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            DevHub
        {% endblock %}
    </title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'core/style.css' %}">
    {% block extra_css %}
    {% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">DevHub</a>

            <form class="d-flex flex-grow-1 me-4"
                method="GET"
                action="{% url 'search' %}">

                <input
                    class="form-control"
                    type="search"
                    name="q"
                    placeholder="Search projects..."
                    value="{{ request.GET.q }}"
                    style="width: 300px;">

            </form>
            
            <div class="ms-auto">
                {% if user.is_authenticated %}
                    <a href="{% url 'new_project' %}" class="btn btn-outline-light me-2">New Project</a>
                    <a href="{% url 'profile_page' username=user.username %}" class="btn btn-outline-light me-2">Profile</a>
                    <form method="post" action="{% url 'logout' %}" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">Logout</button>
                    </form>
                {% else %}
                    <a href="{% url 'user_login' %}" class="btn btn-outline-light me-2">Login</a>
                    <a href="{% url 'register' %}" class="btn btn-primary">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}
    {% endblock %}
</body>
<script>
document.querySelector('input[name="q"]').addEventListener("search", function () {
    if (this.value === "") {
        window.location.href = "{% url 'home' %}";
    }
});
</script>
</html>
